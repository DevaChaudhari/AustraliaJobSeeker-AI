version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
    customHeaders:
      - pattern: "**/*"
        headers:
          - { key: X-Content-Type-Options, value: nosniff }
          - { key: X-Frame-Options, value: DENY }
          - { key: Referrer-Policy, value: strict-origin-when-cross-origin }
      - pattern: "/assets/**"
        headers:
          - { key: Cache-Control, value: "public, max-age=31536000, immutable" }
