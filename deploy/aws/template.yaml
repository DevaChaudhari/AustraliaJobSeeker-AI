AWSTemplateFormatVersion: "2010-09-09"
Description: AustraliaJobSeeker AI backend - one Lambda function (container image) with a public HTTPS Function URL

# Pay-per-use: no load balancer, no always-on container. Idle costs nothing; a search runs
# inside Lambda's always-free allowance (400,000 GB-seconds a month).

Parameters:
  ImageUri:
    Type: String
    Description: Full ECR image URI including tag
  GroqApiKey:
    Type: String
    NoEcho: true
  AllowedOrigins:
    Type: String
    Default: "*"
    Description: Comma-separated browser origins allowed by CORS, e.g. https://main.xxxx.amplifyapp.com
  MemorySize:
    Type: Number
    Default: 2048
    MinValue: 1024
    MaxValue: 10240
    Description: MB of memory. Chromium needs about 2 GB; more memory also gives more CPU.
  BudgetEmail:
    Type: String
    Default: ""
    Description: Optional. Email for a monthly cost alert
  BudgetLimitUsd:
    Type: Number
    Default: 5

Conditions:
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, ""]]

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}"
      RetentionInDays: 7

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: !Ref AWS::StackName
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [x86_64]
      Role: !GetAtt ExecutionRole.Arn
      MemorySize: !Ref MemorySize
      Timeout: 900 # a search scrapes Seek and calls the LLM per job; 15 minutes is Lambda's maximum
      EphemeralStorage:
        Size: 1024
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          # Stored encrypted with the AWS-managed key. Secrets Manager would add $0.40/month.
          GROQ_API_KEY: !Ref GroqApiKey
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          SEEK_MAX_PAGES: "1"
          SEEK_MAX_JOBS: "10"
          MAX_RESPONSE_JOBS: "10"

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE
      InvokeMode: BUFFERED
      # No Cors block here: FastAPI's CORSMiddleware already sets the headers.

  # A public Function URL needs both permissions, each limited to calls that come through the URL.
  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  CostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }

Outputs:
  ApiUrl:
    Description: HTTPS URL of the API (ends with a slash; drop it when setting VITE_API_URL)
    Value: !GetAtt FunctionUrl.FunctionUrl
