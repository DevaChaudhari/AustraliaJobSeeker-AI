apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: australiajobseeker-ingress
  namespace: australiajobseeker
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: localhost
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: app-internal
            port:
              number: 8000
      - path: /a2a
        pathType: Prefix
        backend:
          service:
            name: app-internal
            port:
              number: 9999
